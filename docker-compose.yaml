version: '3.8'

services:
  postgress:
    image: postgres
    container_name: postgress
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgress_data:/var/lib/postgresql/data

volumes:
  postgress_data:
